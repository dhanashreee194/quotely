appId: com.hyperlychee.quotely
productName: Quotely
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!e2e/*'
  - '!e2e-results/*'
  - '!playwright-report/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!playwright.config.ts'
  - '!vitest.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # Native module must load from unpacked filesystem in the installed app.
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: Quotely
  icon: icon.png
nsis:
  artifactName: QuotelySetup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  # Assisted installer required when allowToChangeInstallationDirectory is true.
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  icon: icon.png
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
# Rebuild native deps (better-sqlite3) against the Electron ABI for packaged builds.
npmRebuild: true
# Windows code signing: set CSC_LINK / CSC_KEY_PASSWORD in CI (see .github/workflows/build-win.yml).
# Prefer `npm run build:win` on Windows or the Windows GitHub Actions runner when signing.
publish:
  provider: generic
  url: https://example.com/auto-updates
