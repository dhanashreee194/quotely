name: Build Windows

on:
  push:
    branches: [master, main, 'ci/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build Windows installer
        env:
          # Code signing (optional). When a certificate is available, set these
          # repository secrets and electron-builder will sign the NSIS installer:
          #   CSC_LINK          — base64-encoded .p12/.pfx, or path to the cert file
          #   CSC_KEY_PASSWORD  — certificate password
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build:win

      - name: Silent install and launch smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/QuotelySetup-*.exe | Select-Object -First 1
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer exited with code $($proc.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Quotely\Quotely.exe'
          if (-not (Test-Path $exe)) { throw "Installed app not found at $exe" }
          $data = Join-Path $env:RUNNER_TEMP 'quotely-smoke'
          $env:QUOTELY_E2E = '1'
          $env:QUOTELY_E2E_USER_DATA = $data
          $app = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            $app.Refresh()
            if ($app.HasExited) { break }
            if ((Test-Path (Join-Path $data 'quotely.db')) -and ($app.MainWindowHandle -ne 0)) { $ok = $true; Start-Sleep -Seconds 8; break }
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save((Join-Path $env:RUNNER_TEMP 'smoke-screenshot.png'))
          $log = Join-Path $data 'startup-error.log'
          if (Test-Path $log) { Get-Content $log; throw 'startup-error.log was written' }
          if ($app.HasExited) { throw "App exited early with code $($app.ExitCode)" }
          if (-not $ok) { throw 'App did not create its database and show a window within 60s' }
          Write-Host 'Smoke test passed: installed, launched, window shown, database created, still running.'
          Stop-Process -Id $app.Id -Force

      - name: Upload smoke test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: ${{ runner.temp }}/smoke-screenshot.png
          if-no-files-found: ignore

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuotelySetup-windows-x64
          path: dist/QuotelySetup-*.exe
          if-no-files-found: error
