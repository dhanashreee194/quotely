name: Build Windows

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build Windows installer
        env:
          # Code signing (optional). When a certificate is available, set these
          # repository secrets and electron-builder will sign the NSIS installer:
          #   CSC_LINK          — base64-encoded .p12/.pfx, or path to the cert file
          #   CSC_KEY_PASSWORD  — certificate password
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run build:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuotelySetup-windows-x64
          path: dist/QuotelySetup-*.exe
          if-no-files-found: error
